<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Paseo Desktop Pet</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        background: transparent;
        overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        user-select: none;
        -webkit-app-region: drag;
      }
      #pet-container {
        width: 120px;
        height: 120px;
        position: relative;
        cursor: grab;
      }
      #bubble {
        position: absolute;
        top: 0;
        left: 10px;
        background: rgba(20, 20, 20, 0.9);
        color: #fff;
        font-size: 11px;
        padding: 4px 8px;
        border-radius: 6px;
        display: none;
        border: 1px solid #333;
        white-space: nowrap;
      }
      #flyout {
        position: absolute;
        left: 130px;
        top: 10px;
        width: 240px;
        background: #181b1a;
        border: 1px solid #2e3430;
        border-radius: 8px;
        padding: 10px;
        display: none;
        color: #eee;
        -webkit-app-region: no-drag;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
      }
      .task-item {
        font-size: 11px;
        margin-bottom: 8px;
        padding-bottom: 6px;
        border-bottom: 1px solid #282d2a;
      }
      .btn {
        background: #2563eb;
        color: #fff;
        border: none;
        padding: 2px 6px;
        border-radius: 4px;
        font-size: 10px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div id="pet-container">
      <div id="bubble">⏳ 01:20</div>
      <canvas id="pet-canvas" width="120" height="120"></canvas>
    </div>
    <div id="flyout">
      <div style="font-weight: bold; font-size: 12px; margin-bottom: 6px">🐾 Active Tasks</div>
      <div id="task-list"></div>
    </div>
    <script type="module" src="./companion-client.ts"></script>
  </body>
</html>
